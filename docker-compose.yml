services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ausgov-postgres
    environment:
      POSTGRES_USER: ausgov
      POSTGRES_PASSWORD: ausgov
      POSTGRES_DB: ausgov
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ausgov -d ausgov"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    container_name: ausgov-neo4j
    environment:
      NEO4J_AUTH: neo4j/ausgovmap
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  neo4j-init:
    image: neo4j:5.26-community
    container_name: ausgov-neo4j-init
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_AUTH: neo4j/ausgovmap
    volumes:
      - ./infra/neo4j/constraints.cypher:/constraints.cypher:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        echo "Applying Neo4j constraints..."
        cypher-shell -a bolt://neo4j:7687 -u neo4j -p ausgovmap --file /constraints.cypher
        echo "Neo4j graph model ready."
    restart: "no"

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ausgov-web
    environment:
      DATABASE_URL: postgresql://ausgov:ausgov@postgres:5432/ausgov
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  ingest:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    container_name: ausgov-ingest
    environment:
      DATABASE_URL: postgresql://ausgov:ausgov@postgres:5432/ausgov
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ausgovmap
      EMBEDDING_PROVIDER: hash
      EMBEDDING_DIM: "384"
      INGEST_FALLBACK_FIXTURE: "1"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    # Override at run time, e.g.:
    # docker compose --profile app run --rm ingest run --source fixture
    command: ["python", "-m", "aus_gov_ingest", "run", "--source", "fixture"]

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
