[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aus-gov-ingest"
version = "0.1.0"
description = "Ingest pipeline for aus-gov-map (fetch → parse → chunk → embed → upsert)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "aus-gov-map contributors" }]
dependencies = [
  "beautifulsoup4>=4.12",
  "click>=8.1",
  "httpx>=0.27",
  "lxml>=5.2",
  "neo4j>=5.23",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]
openai = []
sentence-transformers = ["sentence-transformers>=3.0"]

[project.scripts]
aus-gov-ingest = "aus_gov_ingest.cli:cli"
ingest = "aus_gov_ingest.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
